name: Refresh GMV dashboard

on:
  schedule:
    # GitHub cron runs in UTC. Beijing time = UTC+8:
    - cron: "30 2 * * *"   # 10:30 Beijing time
    - cron: "0 10 * * *"   # 18:00 Beijing time
  workflow_dispatch: {}    # lets you click "Run workflow" manually to test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build dashboard.html from the latest ops sheet
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: |
          mkdir -p site
          python3 scripts/build_dashboard.py scripts/dashboard_template.html site/index.html

      - name: Set up Node (for page encryption)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Password-protect the page
        env:
          # Set this under Settings -> Secrets and variables -> Actions
          STATICRYPT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Secret DASHBOARD_PASSWORD is not set - refusing to publish an unprotected page"
            exit 1
          fi
          if [ "${#STATICRYPT_PASSWORD}" -lt 10 ]; then
            echo "::error::DASHBOARD_PASSWORD must be at least 10 characters"
            exit 1
          fi
          # The salt is not secret; keeping it fixed means "remember me" keeps
          # working across the twice-daily rebuilds.
          npx --yes staticrypt@3 site/index.html -d site \
            --salt 5c1f0b7a93d24e68a7b3c9d1e4f60a82 --remember 7 --short \
            --template-title "Life Extension GMV Dashboard" \
            --template-instructions "Confidential - please enter the access password to view the dashboard." \
            --template-placeholder "Password" \
            --template-button "Open dashboard" \
            --template-remember "Remember me for 7 days" \
            --template-error "Incorrect password, please try again." \
            --template-color-primary "#0e2d52" \
            --template-color-secondary "#e4e9ee"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
