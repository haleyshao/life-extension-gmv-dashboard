<title>Life Extension GMV 看板</title>
<style>
  :root{
    color-scheme: light;
    --bg-page:#f9f9f7;
    --surface:#fcfcfb;
    --surface-raise:#ffffff;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:#898781;
    --border:#e1e0d9;
    --baseline:#c3c2b7;
    --accent:#2a78d6;
    --accent-wash:#e8f0fb;
    --g-tmall:#2a78d6;
    --g-jd:#eb6834;
    --g-douyin:#1baf7a;
    --g-red:#eda100;
    --g-vip:#e87ba4;
    --g-pdd:#008300;
    --g-b2b:#4a3aa7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg-page:#0d0d0d;
      --surface:#1a1a19;
      --surface-raise:#212120;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:#898781;
      --border:#2c2c2a;
      --baseline:#383835;
      --accent:#3987e5;
      --accent-wash:#1c2733;
      --g-tmall:#3987e5;
      --g-jd:#d95926;
      --g-douyin:#199e70;
      --g-red:#c98500;
      --g-vip:#d55181;
      --g-pdd:#008300;
      --g-b2b:#9085e9;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg-page:#0d0d0d;
    --surface:#1a1a19;
    --surface-raise:#212120;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#898781;
    --border:#2c2c2a;
    --baseline:#383835;
    --accent:#3987e5;
    --accent-wash:#1c2733;
    --g-tmall:#3987e5;
    --g-jd:#d95926;
    --g-douyin:#199e70;
    --g-red:#c98500;
    --g-vip:#d55181;
    --g-pdd:#008300;
    --g-b2b:#9085e9;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding-inline:16px;
    padding-block:24px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header.top{margin-bottom:18px;}
  header.top .eyebrow{
    font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:6px;
  }
  h1{font-size:1.6rem;margin:0 0 4px;font-weight:700;text-wrap:balance;}
  .subtitle{color:var(--text-secondary);font-size:.92rem;margin:0;max-width:60ch;}
  .demo-badge{
    display:inline-block;margin-top:10px;font-size:.76rem;color:var(--text-muted);
    border:1px solid var(--border);border-radius:6px;padding:4px 10px;
  }
  .empty-state{
    margin:14px 0;padding:14px 16px;background:var(--accent-wash);border:1px solid var(--border);
    border-radius:10px;color:var(--text-secondary);font-size:.88rem;
  }

  .filters{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    margin:18px 0 18px;padding:12px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
  }
  .filters .group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .filters label{font-size:.76rem;color:var(--text-muted);margin-right:2px;}
  .seg{
    display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;
    background:var(--surface-raise);
  }
  .seg button{
    font:inherit;font-size:.84rem;padding:6px 14px;border:none;background:transparent;
    color:var(--text-secondary);cursor:pointer;border-right:1px solid var(--border);
  }
  .seg button:last-child{border-right:none;}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600;}
  select, input[type="date"]{
    font:inherit;font-size:.84rem;padding:6px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface-raise);color:var(--text-primary);
  }
  .range-sep{color:var(--text-muted);font-size:.84rem;}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  @media (max-width:640px){.tiles{grid-template-columns:1fr;}}
  .tile{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;
  }
  .tile .k{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
  .tile .v{font-size:1.5rem;font-weight:700;margin-top:4px;}
  .tile .d{font-size:.78rem;color:var(--text-secondary);margin-top:2px;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:18px 18px 14px;margin-bottom:20px;
  }
  .card h2{font-size:1.02rem;margin:0 0 2px;font-weight:700;}
  .card .card-sub{font-size:.82rem;color:var(--text-secondary);margin:0 0 12px;}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 14px;}
  .legend .item{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text-secondary);}
  .legend .swatch{width:10px;height:10px;border-radius:2px;flex:none;}

  .chart-scroll{overflow-x:auto;}
  svg.chart{display:block;font-family:inherit;}
  .bar-seg{cursor:pointer;}
  .axis-label{fill:var(--text-muted);font-size:10px;}
  .grid-line{stroke:var(--border);stroke-width:1;}
  .baseline{stroke:var(--baseline);stroke-width:1;}

  #tooltip{
    position:fixed;pointer-events:none;z-index:50;
    background:var(--surface-raise);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:.78rem;box-shadow:0 4px 14px rgba(0,0,0,.12);
    max-width:220px;opacity:0;transition:opacity .08s;
  }
  #tooltip.show{opacity:1;}
  #tooltip .tt-date{font-weight:700;margin-bottom:4px;color:var(--text-primary);}
  #tooltip .tt-row{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:1px 0;}
  #tooltip .tt-row .name{display:flex;align-items:center;gap:5px;color:var(--text-secondary);}
  #tooltip .tt-row .dot{width:8px;height:8px;border-radius:2px;flex:none;}
  #tooltip .tt-row .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-primary);}
  #tooltip .tt-total{border-top:1px solid var(--border);margin-top:4px;padding-top:4px;font-weight:700;}

  table.detail{width:100%;border-collapse:collapse;font-size:.82rem;}
  table.detail th, table.detail td{
    padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  table.detail th:first-child, table.detail td:first-child{text-align:left;font-variant-numeric:normal;}
  table.detail thead th{
    color:var(--text-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;
    font-weight:700;border-bottom:1px solid var(--border);
  }
  table.detail tbody tr:hover{background:var(--accent-wash);}
  table.detail tr.total-row td{font-weight:700;border-top:1px solid var(--border);}
  .table-scroll{overflow-x:auto;}

  footer.note{color:var(--text-muted);font-size:.8rem;margin-top:6px;}
</style>

<div class="wrap">

  <header class="top">
    <div class="eyebrow">Life Extension</div>
    <h1>GMV 看板</h1>
    <p class="subtitle">按渠道拆分的 GMV 走势与明细,支持日/周/月切换和自定义时间范围。数据每小时从运营填报表自动同步一次。</p>
    <span class="demo-badge" id="syncBadge">同步中…</span>
  </header>

  <div class="empty-state" id="emptyState" hidden>运营团队暂未开始填报,数据同步后会在这里自动显示。</div>

  <div class="filters">
    <div class="group">
      <label>粒度</label>
      <div class="seg" id="granSeg" role="group" aria-label="时间粒度">
        <button data-g="day" aria-pressed="true">日</button>
        <button data-g="week" aria-pressed="false">周</button>
        <button data-g="month" aria-pressed="false">月</button>
      </div>
    </div>
    <div class="group">
      <label>预设</label>
      <select id="presetSel">
        <option value="last14">最近 14 天</option>
        <option value="last30" selected>最近 30 天</option>
        <option value="last60">最近 60 天</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="group" id="customRange" hidden>
      <input type="date" id="rangeStart">
      <span class="range-sep">至</span>
      <input type="date" id="rangeEnd">
    </div>
  </div>

  <div class="tiles">
    <div class="tile">
      <div class="k">所选区间 GMV 合计</div>
      <div class="v" id="tileTotal">—</div>
      <div class="d" id="tileTotalSub">—</div>
    </div>
    <div class="tile">
      <div class="k">日均 GMV</div>
      <div class="v" id="tileAvg">—</div>
      <div class="d">按所选区间天数平均</div>
    </div>
    <div class="tile">
      <div class="k">最大占比渠道</div>
      <div class="v" id="tileTop">—</div>
      <div class="d" id="tileTopSub">—</div>
    </div>
  </div>

  <section class="card">
    <h2>GMV by 平台分组</h2>
    <p class="card-sub">堆叠柱状图按天/周/月聚合;鼠标悬浮查看当期各渠道明细。</p>
    <div class="legend" id="legend"></div>
    <div class="chart-scroll">
      <svg class="chart" id="chartSvg"></svg>
    </div>
  </section>

  <section class="card">
    <h2>渠道明细表</h2>
    <p class="card-sub">按所选区间汇总的子渠道 GMV,和柱状图的平台分组对应。</p>
    <div class="table-scroll">
      <table class="detail" id="detailTable"></table>
    </div>
    <footer class="note" id="footerNote">数据来源:运营渠道数据填报表(每日填报 · GMV)。仅展示 GMV,不含净销售与目标数据。</footer>
  </section>

</div>

<div id="tooltip"></div>

<script>
(function(){
  "use strict";

  var GROUPS = [
    {key:"tmall", label:"天猫平台", color:"var(--g-tmall)"},
    {key:"jd", label:"京东平台", color:"var(--g-jd)"},
    {key:"douyin", label:"抖音", color:"var(--g-douyin)"},
    {key:"red", label:"小红书", color:"var(--g-red)"},
    {key:"vip", label:"唯品会", color:"var(--g-vip)"},
    {key:"pdd", label:"拼多多", color:"var(--g-pdd)"},
    {key:"b2b", label:"分销(B2B)", color:"var(--g-b2b)"}
  ];

  var SUBCHANNELS = [
    {key:"tmall_flagship", label:"天猫旗舰店", group:"tmall"},
    {key:"tmall_alihealth", label:"AliHealth", group:"tmall"},
    {key:"tmall_tdi", label:"TDI", group:"tmall"},
    {key:"jd_self", label:"京东自营", group:"jd"},
    {key:"jd_pop", label:"京东POP", group:"jd"},
    {key:"douyin", label:"抖音", group:"douyin"},
    {key:"red", label:"小红书", group:"red"},
    {key:"vip", label:"唯品会", group:"vip"},
    {key:"pdd", label:"拼多多", group:"pdd"},
    {key:"b2b", label:"分销", group:"b2b"}
  ];

  // ---- real data, baked in at build time from the ops fill-in sheet ----
  // BUILD_META and REAL_RECORDS are replaced by build_dashboard.py on every regeneration.
  // REAL_RECORDS: [{date:"YYYY-MM-DD", tmall_flagship:N, tmall_alihealth:N, ...}, ...]
  var BUILD_META = {"generatedAt":"__PENDING__","sourceNote":"__PENDING__"};
  var REAL_RECORDS = [];

  var records = REAL_RECORDS.map(function(r){
    var rec = {date: parseDate(r.date)};
    SUBCHANNELS.forEach(function(sc){ rec[sc.key] = r[sc.key] || 0; });
    return rec;
  });

  var HAS_DATA = records.length > 0 && records.some(function(rec){
    return SUBCHANNELS.some(function(sc){ return rec[sc.key] > 0; });
  });

  if (records.length === 0){
    // nothing filled in yet - keep a single placeholder day (today) so date math below has an anchor
    var rec0 = {date: new Date()};
    SUBCHANNELS.forEach(function(sc){ rec0[sc.key] = 0; });
    records.push(rec0);
  }

  function groupValue(rec, groupKey){
    var total = 0;
    SUBCHANNELS.forEach(function(sc){ if (sc.group === groupKey) total += rec[sc.key]; });
    return total;
  }

  // ---- state ----
  var state = {
    granularity: "day",
    preset: "last30",
    rangeStart: null,
    rangeEnd: null
  };

  function fmtDate(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function parseDate(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtMoney(n){
    if (n >= 10000) return "¥" + (n/10000).toFixed(1) + "万";
    return "¥" + Math.round(n).toLocaleString("zh-CN");
  }
  function fmtInt(n){ return Math.round(n).toLocaleString("zh-CN"); }

  function currentRange(){
    if (state.preset === "custom" && state.rangeStart && state.rangeEnd){
      return {start: state.rangeStart, end: state.rangeEnd};
    }
    var n = state.preset === "last14" ? 14 : state.preset === "last60" ? 60 : 30;
    var end = records[records.length-1].date;
    var start = new Date(end); start.setDate(start.getDate() - (n-1));
    return {start: start, end: end};
  }

  function filteredRecords(){
    var r = currentRange();
    return records.filter(function(rec){ return rec.date >= r.start && rec.date <= r.end; });
  }

  function isoWeekKey(d){
    var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = (dt.getDay() + 6) % 7; // Mon=0
    dt.setDate(dt.getDate() - day);
    return dt.getFullYear() + "-W" + fmtDate(dt);
  }
  function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }

  function bucketData(recs, gran){
    if (gran === "day"){
      return recs.map(function(rec){
        return {label: (rec.date.getMonth()+1) + "/" + rec.date.getDate(), sub: rec, dateRange: fmtDate(rec.date)};
      });
    }
    var keyFn = gran === "week" ? isoWeekKey : monthKey;
    var order = [], map = {};
    recs.forEach(function(rec){
      var k = keyFn(rec.date);
      if (!map[k]){ map[k] = {label:null, sub:{date:rec.date}, first:rec.date, last:rec.date}; order.push(k); }
      var bucket = map[k];
      if (rec.date < bucket.first) bucket.first = rec.date;
      if (rec.date > bucket.last) bucket.last = rec.date;
      SUBCHANNELS.forEach(function(sc){ bucket.sub[sc.key] = (bucket.sub[sc.key]||0) + rec[sc.key]; });
    });
    return order.map(function(k){
      var b = map[k];
      var label = gran === "week"
        ? (b.first.getMonth()+1) + "/" + b.first.getDate()
        : (b.first.getFullYear()) + "/" + (b.first.getMonth()+1);
      var dateRange = gran === "week"
        ? fmtDate(b.first) + " ~ " + fmtDate(b.last)
        : fmtDate(b.first).slice(0,7);
      return {label: label, sub: b.sub, dateRange: dateRange};
    });
  }

  // ---- rendering ----
  var svgNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs){
    var el = document.createElementNS(svgNS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function niceMax(v){
    if (v <= 0) return 100;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var norm = v / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * mag;
  }

  function renderLegend(){
    var el = document.getElementById("legend");
    el.innerHTML = "";
    GROUPS.forEach(function(g){
      var item = document.createElement("span");
      item.className = "item";
      var sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = g.color;
      item.appendChild(sw);
      var txt = document.createElement("span");
      txt.textContent = g.label;
      item.appendChild(txt);
      el.appendChild(item);
    });
  }

  var tooltip = document.getElementById("tooltip");

  function showTooltip(evt, bucket, groupHighlight){
    var total = 0;
    var rows = GROUPS.map(function(g){
      var v = groupValue(bucket.sub, g.key);
      total += v;
      return {g:g, v:v};
    });
    var html = '<div class="tt-date"></div>';
    tooltip.innerHTML = "";
    var dateEl = document.createElement("div");
    dateEl.className = "tt-date";
    dateEl.textContent = bucket.dateRange;
    tooltip.appendChild(dateEl);
    rows.forEach(function(r){
      var row = document.createElement("div");
      row.className = "tt-row";
      var nameWrap = document.createElement("span");
      nameWrap.className = "name";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = r.g.color;
      nameWrap.appendChild(dot);
      var nameTxt = document.createElement("span");
      nameTxt.textContent = r.g.label;
      nameWrap.appendChild(nameTxt);
      row.appendChild(nameWrap);
      var val = document.createElement("span");
      val.className = "val";
      val.textContent = fmtInt(r.v);
      row.appendChild(val);
      if (groupHighlight && groupHighlight !== r.g.key) row.style.opacity = "0.45";
      tooltip.appendChild(row);
    });
    var totalRow = document.createElement("div");
    totalRow.className = "tt-row tt-total";
    var totalLabel = document.createElement("span");
    totalLabel.textContent = "合计";
    totalRow.appendChild(totalLabel);
    var totalVal = document.createElement("span");
    totalVal.className = "val";
    totalVal.textContent = fmtInt(total);
    totalRow.appendChild(totalVal);
    tooltip.appendChild(totalRow);

    tooltip.classList.add("show");
    positionTooltip(evt);
  }
  function positionTooltip(evt){
    var pad = 14;
    var x = evt.clientX + pad, y = evt.clientY + pad;
    var tw = tooltip.offsetWidth || 200, th = tooltip.offsetHeight || 80;
    if (x + tw > window.innerWidth - 8) x = evt.clientX - tw - pad;
    if (y + th > window.innerHeight - 8) y = evt.clientY - th - pad;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function hideTooltip(){ tooltip.classList.remove("show"); }

  function renderChart(){
    var buckets = bucketData(filteredRecords(), state.granularity);
    var svg = document.getElementById("chartSvg");
    svg.innerHTML = "";

    var barW = state.granularity === "day" ? 18 : 34;
    var gap = 10;
    var n = buckets.length;
    var plotW = Math.max(560, n * (barW + gap) + gap);
    var plotH = 260;
    var marginLeft = 56, marginBottom = 26, marginTop = 10;
    var totalW = plotW + marginLeft + 12;
    var totalH = plotH + marginTop + marginBottom;
    svg.setAttribute("width", totalW);
    svg.setAttribute("height", totalH);
    svg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);

    var maxTotal = 0;
    buckets.forEach(function(b){
      var t = 0;
      GROUPS.forEach(function(g){ t += groupValue(b.sub, g.key); });
      if (t > maxTotal) maxTotal = t;
    });
    var axisMax = niceMax(maxTotal * 1.08);
    var ticks = 4;

    // gridlines + y labels
    for (var t = 0; t <= ticks; t++){
      var val = axisMax * t / ticks;
      var y = marginTop + plotH - (plotH * t / ticks);
      svg.appendChild(svgEl("line", {
        x1: marginLeft, x2: marginLeft + plotW, y1: y, y2: y,
        class: t === 0 ? "baseline" : "grid-line"
      }));
      var label = svgEl("text", {x: marginLeft - 8, y: y + 3, "text-anchor": "end", class: "axis-label"});
      label.textContent = val === 0 ? "0" : fmtMoney(val);
      svg.appendChild(label);
    }

    buckets.forEach(function(b, i){
      var x = marginLeft + gap + i * (barW + gap);
      var yCursor = marginTop + plotH;
      GROUPS.forEach(function(g){
        var v = groupValue(b.sub, g.key);
        if (v <= 0) return;
        var h = (v / axisMax) * plotH;
        var yTop = yCursor - h;
        var rect = svgEl("rect", {
          x: x, y: yTop, width: barW, height: Math.max(h - 2, 0),
          rx: 3, style: "fill:" + g.color, class: "bar-seg"
        });
        rect.addEventListener("pointerenter", function(evt){ showTooltip(evt, b, g.key); });
        rect.addEventListener("pointermove", positionTooltip);
        rect.addEventListener("pointerleave", hideTooltip);
        svg.appendChild(rect);
        yCursor = yTop;
      });
      if (i % Math.ceil(n / 16 || 1) === 0 || n <= 16){
        var xl = svgEl("text", {x: x + barW/2, y: marginTop + plotH + 16, "text-anchor": "middle", class: "axis-label"});
        xl.textContent = b.label;
        svg.appendChild(xl);
      }
    });
  }

  function renderTiles(){
    var recs = filteredRecords();
    var groupTotals = {};
    var grand = 0;
    GROUPS.forEach(function(g){ groupTotals[g.key] = 0; });
    recs.forEach(function(rec){
      GROUPS.forEach(function(g){
        var v = groupValue(rec, g.key);
        groupTotals[g.key] += v;
        grand += v;
      });
    });
    document.getElementById("tileTotal").textContent = fmtMoney(grand);
    var r = currentRange();
    document.getElementById("tileTotalSub").textContent = fmtDate(r.start) + " ~ " + fmtDate(r.end);
    document.getElementById("tileAvg").textContent = fmtMoney(grand / Math.max(recs.length,1));

    var topKey = GROUPS[0].key;
    GROUPS.forEach(function(g){ if (groupTotals[g.key] > groupTotals[topKey]) topKey = g.key; });
    var topGroup = GROUPS.filter(function(g){ return g.key === topKey; })[0];
    document.getElementById("tileTop").textContent = topGroup.label;
    var pct = grand > 0 ? (groupTotals[topKey] / grand * 100).toFixed(1) : "0";
    document.getElementById("tileTopSub").textContent = "占所选区间 GMV 的 " + pct + "%";
  }

  function renderTable(){
    var recs = filteredRecords();
    var totals = {};
    SUBCHANNELS.forEach(function(sc){ totals[sc.key] = 0; });
    recs.forEach(function(rec){
      SUBCHANNELS.forEach(function(sc){ totals[sc.key] += rec[sc.key]; });
    });

    var table = document.getElementById("detailTable");
    table.innerHTML = "";
    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    var hCells = ["渠道", "平台分组", "GMV 合计", "占比"];
    hCells.forEach(function(h){
      var th = document.createElement("th");
      th.textContent = h;
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    var grand = 0;
    SUBCHANNELS.forEach(function(sc){ grand += totals[sc.key]; });

    SUBCHANNELS.forEach(function(sc){
      var tr = document.createElement("tr");
      var tdName = document.createElement("td"); tdName.textContent = sc.label; tr.appendChild(tdName);
      var grp = GROUPS.filter(function(g){ return g.key === sc.group; })[0];
      var tdGroup = document.createElement("td");
      var dotSpan = document.createElement("span");
      dotSpan.style.display = "inline-block";
      dotSpan.style.width = "8px"; dotSpan.style.height = "8px"; dotSpan.style.borderRadius = "2px";
      dotSpan.style.background = grp.color; dotSpan.style.marginRight = "6px"; dotSpan.style.verticalAlign="middle";
      tdGroup.appendChild(dotSpan);
      var grpTxt = document.createElement("span"); grpTxt.textContent = grp.label;
      tdGroup.appendChild(grpTxt);
      tdGroup.style.textAlign = "left";
      tr.appendChild(tdGroup);
      var tdVal = document.createElement("td"); tdVal.textContent = fmtInt(totals[sc.key]); tr.appendChild(tdVal);
      var tdPct = document.createElement("td");
      tdPct.textContent = (grand > 0 ? (totals[sc.key]/grand*100).toFixed(1) : "0") + "%";
      tr.appendChild(tdPct);
      tbody.appendChild(tr);
    });

    var trTotal = document.createElement("tr");
    trTotal.className = "total-row";
    var tdT1 = document.createElement("td"); tdT1.textContent = "合计"; trTotal.appendChild(tdT1);
    var tdT2 = document.createElement("td"); trTotal.appendChild(tdT2);
    var tdT3 = document.createElement("td"); tdT3.textContent = fmtInt(grand); trTotal.appendChild(tdT3);
    var tdT4 = document.createElement("td"); tdT4.textContent = "100%"; trTotal.appendChild(tdT4);
    tbody.appendChild(trTotal);

    table.appendChild(tbody);
  }

  function renderAll(){
    renderTiles();
    renderChart();
    renderTable();
  }

  // ---- wiring ----
  document.getElementById("granSeg").addEventListener("click", function(evt){
    var btn = evt.target.closest("button");
    if (!btn) return;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(b){ b.setAttribute("aria-pressed", "false"); });
    btn.setAttribute("aria-pressed", "true");
    state.granularity = btn.getAttribute("data-g");
    renderAll();
  });

  var presetSel = document.getElementById("presetSel");
  var customRange = document.getElementById("customRange");
  var rangeStartInput = document.getElementById("rangeStart");
  var rangeEndInput = document.getElementById("rangeEnd");
  rangeEndInput.value = fmtDate(records[records.length-1].date);
  var defaultStart = new Date(records[records.length-1].date); defaultStart.setDate(defaultStart.getDate()-29);
  rangeStartInput.value = fmtDate(defaultStart);

  presetSel.addEventListener("change", function(){
    state.preset = presetSel.value;
    customRange.hidden = state.preset !== "custom";
    if (state.preset === "custom"){
      state.rangeStart = parseDate(rangeStartInput.value);
      state.rangeEnd = parseDate(rangeEndInput.value);
    }
    renderAll();
  });
  [rangeStartInput, rangeEndInput].forEach(function(inp){
    inp.addEventListener("change", function(){
      if (state.preset !== "custom") return;
      state.rangeStart = parseDate(rangeStartInput.value);
      state.rangeEnd = parseDate(rangeEndInput.value);
      renderAll();
    });
  });

  document.getElementById("syncBadge").textContent = "最近同步:" + (BUILD_META.generatedAt || "—");
  document.getElementById("emptyState").hidden = HAS_DATA;
  document.querySelector(".filters").style.display = HAS_DATA ? "" : "none";
  document.querySelector(".tiles").style.display = HAS_DATA ? "" : "none";
  document.querySelectorAll(".card").forEach(function(el){ el.style.display = HAS_DATA ? "" : "none"; });

  renderLegend();
  renderAll();
})();
</script>
